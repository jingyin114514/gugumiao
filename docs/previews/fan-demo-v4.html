<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自选股折扇</title>
<style>
:root{
  --bg:#F6F4EF;
  --paper:#FFFFFF;
  --ink:#1F2937;
  --muted:#6B7280;
  --line:#E5E1D8;
  --accent:#B45309;
  --green:#15803D; --red:#B91C1C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:48px 16px 24px;
}
h1{font-size:15px; font-weight:600; letter-spacing:4px; margin-bottom:8px}
.caption{color:var(--muted); font-size:12px; margin-bottom:24px}
.toggle{
  font:inherit; font-size:12px; color:var(--muted); background:none;
  border:none; padding:6px 10px; cursor:pointer; border-radius:6px;
  transition:color .2s ease-in-out, background .2s ease-in-out;
}
.toggle:hover{color:var(--ink); background:rgba(31,41,55,.05)}

.fan-wrapper{position:relative; width:820px; max-width:96vw; height:440px; margin:0 auto}
.fan-stage{position:absolute; inset:0; outline:none}
.fan{
  position:absolute; left:50%; bottom:42px; width:760px; height:380px;
  margin-left:-380px; transform-origin:50% 100%;
  transform:rotate(-90deg) scaleX(.1);
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
}
.fan-stage:hover .fan, .fan-stage.open .fan{transform:rotate(0deg) scaleX(1)}

/* 扇叶：白纸楔形，极简 */
.blade{
  position:absolute; left:380px; top:342.5px; width:380px; height:75px;
  transform-origin:left center;
  transform:rotate(var(--a, 0deg));
  clip-path:path("M 0 37.5 L 378.17 0.254 A 380 380 0 0 1 378.17 74.746 Z");
  background:
    repeating-linear-gradient(0deg, rgba(31,41,55,.025) 0 1px, transparent 1px 6px),
    var(--paper);
  cursor:pointer; z-index:1;
  transition:transform .2s ease-in-out;
}
.blade::after{
  content:""; position:absolute; inset:0; clip-path:inherit;
  background:transparent; pointer-events:none; transition:background .2s ease-in-out;
}
.blade:hover{
  transform:rotate(var(--a, 0deg)) scale(1.03);
  z-index:30;
}
.blade:hover::after{background:rgba(180,83,9,.05)}
.blade.sel{
  transform:rotate(var(--a, 0deg)) scale(1.03);
  z-index:40;
}
.blade.sel::after{background:rgba(180,83,9,.08)}

/* 包边：2px 圆弧细线，悬停/选中浮现 */
.blade-rim{
  position:absolute; inset:0;
  clip-path:path("M 376.2 0.45 L 378.17 0.254 A 380 380 0 0 1 378.17 74.746 L 376.2 74.55 A 378 378 0 0 0 376.2 0.45 Z");
  background:var(--accent);
  opacity:0; transition:opacity .2s ease-in-out; pointer-events:none;
}
.blade:hover .blade-rim, .blade.sel .blade-rim{opacity:1}

/* 文字：正立居中 */
.blade-text{
  position:absolute; left:300px; top:50%;
  transform:translate(-50%,-50%) rotate(calc(-1 * var(--a, 0deg)));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; line-height:1.25; white-space:nowrap;
  color:var(--ink); pointer-events:none; max-width:56px; overflow:hidden;
}
.blade-text .nm{font-weight:600}
.blade-text .cd{color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums}

/* 扇骨：细线 */
.rib{
  position:absolute; left:380px; top:380px; width:380px; height:1px;
  background:rgba(31,41,55,.08);
  transform-origin:left center; pointer-events:none; z-index:5;
}

/* 外弧：发丝线 */
.rim{
  position:absolute; left:0; top:0; width:760px; height:380px;
  border-radius:380px 380px 0 0;
  border:1px solid rgba(31,41,55,.14); border-bottom:none;
  pointer-events:none; z-index:6;
}

.center-pin{
  position:absolute; left:50%; bottom:34px; width:14px; height:14px;
  margin-left:-7px; border-radius:50%;
  background:#8C8377; z-index:7;
}

/* 弹窗 */
.modal-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(31,41,55,.28);
  display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; transition:opacity .2s ease-in-out, visibility .2s;
}
.modal-overlay.show{opacity:1; visibility:visible}
.modal{
  position:relative; width:min(360px,92vw); background:#fff;
  border:1px solid var(--line); border-radius:12px; padding:20px 22px;
  box-shadow:0 10px 30px rgba(31,41,55,.08);
  transform:translateY(8px); transition:transform .2s ease-in-out;
}
.modal-overlay.show .modal{transform:translateY(0)}
.m-head{display:flex; align-items:baseline; gap:8px; margin-bottom:12px; padding-right:28px}
.m-name{font-size:16px; font-weight:600}
.m-code{color:var(--muted); font-size:11px}
.m-price{margin-left:auto; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums}
.m-close{
  position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%;
  border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:14px;
  line-height:1; display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.m-close:hover{background:rgba(31,41,55,.06); color:var(--ink)}
.m-lights{font-size:16px; letter-spacing:1px; margin-bottom:10px}
.m-row{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--muted)}
.m-row b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.verdict{
  display:inline-block; margin-top:10px; padding:2px 10px; border-radius:999px;
  font-size:11.5px; font-weight:600;
}
.v-ok{background:#ECFDF5; color:var(--green)}
.v-warn{background:#FFFBEB; color:#B45309}
.v-bad{background:#FEF2F2; color:var(--red)}
.up{color:var(--red)} .down{color:var(--green)}

@media (max-width:860px){
  .fan-wrapper{transform:scale(.72); transform-origin:top center; height:320px; margin-bottom:24px}
}
@media (prefers-reduced-motion:reduce){
  .fan,.blade,.blade::after,.blade-rim,.modal-overlay,.modal{transition:none}
}
</style>
</head>
<body>
<h1>自选股折扇</h1>
<div class="caption">悬停展开 · 点击查看灯号</div>
<button class="toggle" onclick="togglePin()">展开 / 合拢</button>

<div class="fan-wrapper">
  <div class="fan-stage" id="fanStage" tabindex="0"
       onmouseenter="hoverOpen(true)" onmouseleave="hoverOpen(false)"
       onfocus="hoverOpen(true)" onblur="hoverOpen(false)">
    <div class="fan" id="fanContainer"></div>
    <div class="center-pin"></div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="m-close" onclick="closeModal()" aria-label="关闭">×</button>
    <div class="m-head">
      <span class="m-name" id="mName"></span>
      <span class="m-code" id="mCode"></span>
      <span class="m-price" id="mPrice"></span>
    </div>
    <div class="m-lights" id="mLights"></div>
    <div class="m-row"><span>最新价</span><b id="mPrice2"></b></div>
    <div class="m-row"><span>今日涨跌</span><b id="mChg"></b></div>
    <div class="m-row"><span>六维灯号</span><b id="mCount"></b></div>
    <span class="verdict" id="mVerdict"></span>
  </div>
</div>

<script>
const STOCKS = [
  ["000333","美的集团","85.30","2.16","yellowyellowredgreengreenyellow"],
  ["000537","绿发电力","8.32","10.05","yellowyellowyellowredredyellow"],
  ["002371","北方华创","760.00","1.07","yellowgreenredredgreenyellow"],
  ["002837","英维克","55.24","-1.18","greenyellowyellowyellowgreenyellow"],
  ["003018","金富科技","38.30","-3.72","yellowyellowredredyellowyellow"],
  ["300308","中际旭创","864.58","-6.01","yellowgreenyellowgreengreenyellow"],
  ["300602","飞荣达","36.20","-2.95","greengreenyellowredyellowyellow"],
  ["300750","宁德时代","393.87","1.86","yellowyellowyellowredgreenyellow"],
  ["301018","申菱环境","89.42","3.16","yellowredredredgreenyellow"],
  ["600160","巨化股份","44.26","2.24","yellowgreenyellowredgreenyellow"],
  ["600487","亨通光电","59.62","0.17","yellowgreenredredredyellow"],
  ["600721","百花医药","11.59","9.96","yellowredredyellowredyellow"],
  ["601225","陕西煤业","26.04","3.99","yellowredyellowgreengreenyellow"],
  ["601628","中国人寿","37.70","-2.26","yellowredgreenyellowredyellow"],
  ["601899","紫金矿业","35.45","0.85","yellowgreenyellowgreengreenyellow"],
  ["603259","药明康德","161.34","4.21","yellowgreenredyellowyellowyellow"]
];

const N = STOCKS.length;
const LIGHT = {green:"🟢", yellow:"🟡", red:"🔴"};
const fan = document.getElementById("fanContainer");
const stage = document.getElementById("fanStage");
let pinned = false;

if (location.search.indexOf("open=1") !== -1){
  pinned = true;
  stage.classList.add("open");
}

for (let i = 0; i <= N; i++){
  const a = i * (180 / N) - 180;
  const rib = document.createElement("div");
  rib.className = "rib";
  rib.style.transform = `rotate(${a}deg)`;
  fan.appendChild(rib);
}

STOCKS.forEach((s, i) => {
  const a = (i + 0.5) * (180 / N) - 180;
  const blade = document.createElement("div");
  blade.className = "blade";
  blade.style.setProperty("--a", a + "deg");
  blade.title = `${s[1]} ${s[0]}`;
  blade.setAttribute("role","button");
  blade.setAttribute("tabindex","0");
  blade.setAttribute("aria-label", `${s[1]} ${s[0]}`);
  blade.addEventListener("click", () => select(i, blade));
  blade.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); select(i, blade); }
  });

  const txt = document.createElement("div");
  txt.className = "blade-text";
  const nmLen = [...s[1]].length;
  const fs = Math.max(10, Math.min(15, Math.floor(52 / nmLen)));
  txt.innerHTML = `<span class="nm" style="font-size:${fs}px">${s[1]}</span>` +
                  `<span class="cd">${s[0].slice(-4)}</span>`;
  blade.appendChild(document.createElement("div")).className = "blade-rim";
  blade.appendChild(txt);
  fan.appendChild(blade);
});

if (location.search.indexOf("demo=1") !== -1){
  document.querySelectorAll(".blade")[0].classList.add("sel");
}

function select(i, blade){
  document.querySelectorAll(".blade.sel").forEach(b => b.classList.remove("sel"));
  blade.classList.add("sel");
  showModal(i);
}

function hoverOpen(on){
  if (pinned) return;
  stage.classList.toggle("open", on);
}

function togglePin(){
  pinned = !pinned;
  stage.classList.toggle("open", pinned);
  if (pinned) stage.focus();
}

function showModal(i){
  const s = STOCKS[i];
  const lights = s[4].split("").map(c => LIGHT[c] || "🟡").join("");
  const g = s[4].split("").filter(c => c === "green").length;
  const r = s[4].split("").filter(c => c === "red").length;
  const pct = parseFloat(s[3]);
  const cls = pct > 0 ? "up" : (pct < 0 ? "down" : "");
  document.getElementById("mName").textContent = s[1];
  document.getElementById("mCode").textContent = s[0];
  document.getElementById("mPrice").textContent = s[2];
  document.getElementById("mPrice").className = cls;
  document.getElementById("mLights").textContent = lights;
  document.getElementById("mPrice2").textContent = s[2] + " 元";
  document.getElementById("mChg").textContent = (pct > 0 ? "+" : "") + pct.toFixed(2) + "%";
  document.getElementById("mChg").className = cls;
  document.getElementById("mCount").textContent = `绿 ${g} · 红 ${r}`;
  const v = document.getElementById("mVerdict");
  if (g >= 4 && r === 0){ v.textContent = "可建仓"; v.className = "verdict v-ok"; }
  else if (r >= 2){ v.textContent = "需要关注"; v.className = "verdict v-bad"; }
  else if (g >= 3){ v.textContent = "接近可建仓"; v.className = "verdict v-warn"; }
  else { v.textContent = "暂不可建仓"; v.className = "verdict"; }
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.querySelectorAll(".blade.sel").forEach(b => b.classList.remove("sel"));
  document.getElementById("modal").classList.remove("show");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});
</script>
</body>
</html>
