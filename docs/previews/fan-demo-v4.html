<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自选股折扇 · 交互预览 v4</title>
<style>
:root{
  --ink:#3F3A33; --muted:#8A7F6D;
  --green:#15803D; --red:#B91C1C; --amber:#B45309;
  --wood-dark:#6E5430; --wood:#B08A52; --wood-light:#E8D5A8;
  --card:#FFFFFF; --line:#E9E2D0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#FAF5E6 0%,#F1E7D0 100%);
  color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
  align-items:center; padding:26px 16px;
}
h1{font-family:"STKaiti","KaiTi",serif; font-size:19px; font-weight:600; letter-spacing:2px; margin-bottom:4px}
.caption{color:var(--muted); font-size:12.5px; margin-bottom:16px}
.controls{display:flex; gap:10px; align-items:center; margin-bottom:10px}
.controls button{
  font:inherit; font-size:12.5px; padding:6px 14px; border-radius:999px;
  border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  transition:all .15s;
}
.controls button:hover{border-color:#C9B98F; background:#FBF6E8}
.controls .hint{color:var(--muted); font-size:11.5px}

.fan-wrapper{position:relative; width:820px; max-width:96vw; height:440px; margin:0 auto}
.fan-stage{position:absolute; inset:0; outline:none}
.fan{
  position:absolute; left:50%; bottom:42px; width:760px; height:380px;
  margin-left:-380px;
  transform-origin:50% 100%;
  transform:rotate(-90deg) scaleX(.12);
  transition:transform .7s cubic-bezier(.2,.75,.25,1);
}
.fan-stage:hover .fan, .fan-stage.open .fan{
  transform:rotate(0deg) scaleX(1);
}

/* 扇面：每片独立楔形，带层叠阴影 + 折痕纹理 */
.blade{
  position:absolute; left:380px; top:342.5px; width:380px; height:75px;
  transform-origin:left center;
  transform:rotate(var(--a, 0deg));
  clip-path:polygon(0px 37.5px, 380px 0px, 380px 75px);
  cursor:pointer;
  background:
    linear-gradient(180deg, rgba(140,100,45,.20) 0%, rgba(140,100,45,0) 16%),
    repeating-linear-gradient(0deg, rgba(120,90,40,.07) 0 1px, transparent 1px 5px),
    linear-gradient(180deg, #FDF6E3 0%, #F6EBD0 100%);
  filter:drop-shadow(0 2px 2px rgba(110,80,35,.28));
  transition:transform .18s ease, filter .18s ease;
  z-index:1;
}
.blade::after{
  content:""; position:absolute; inset:0; clip-path:inherit;
  background:transparent; pointer-events:none; transition:background .15s;
}
.blade:hover{
  transform:rotate(var(--a, 0deg)) scale(1.06);
  filter:drop-shadow(0 5px 5px rgba(110,80,35,.38));
  z-index:30;
}
.blade:hover::after{background:rgba(150,110,50,.12)}
.blade.sel{
  transform:rotate(var(--a, 0deg)) scale(1.05);
  filter:drop-shadow(0 4px 6px rgba(110,80,35,.40));
  z-index:40;
}
.blade.sel::after{background:rgba(190,120,40,.26)}

/* 文字：正立居中，反向旋转抵消扇面 */
.blade-text{
  position:absolute; left:253px; top:50%;
  transform:translate(-50%,-50%) rotate(calc(-1 * var(--a, 0deg)));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; line-height:1.2; white-space:nowrap;
  font-family:"STKaiti","KaiTi",serif; color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.6);
  pointer-events:none; max-width:48px; overflow:hidden;
}
.blade-text .nm{font-weight:600}
.blade-text .cd{color:var(--muted); font-variant-numeric:tabular-nums}

/* 扇骨：深色细条，从中心向外辐射 */
.rib{
  position:absolute; left:380px; top:380px; width:380px; height:1.5px;
  background:rgba(100,74,38,.55);
  transform-origin:left center; pointer-events:none; z-index:5;
}

/* 外缘圆弧收边 */
.paper-arc{
  position:absolute; left:0; top:0; width:760px; height:380px;
  border-radius:380px 380px 0 0;
  border:1.5px solid #D9C79A; border-bottom:none;
  pointer-events:none; z-index:6;
  box-shadow:inset 0 -20px 44px rgba(190,160,110,.10);
}

.center-pin{
  position:absolute; left:50%; bottom:31px; width:22px; height:22px;
  margin-left:-11px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #C99F62, var(--wood) 55%, var(--wood-dark));
  box-shadow:0 2px 5px rgba(70,50,20,.45), inset 0 0 0 2px rgba(255,255,255,.28);
  z-index:7;
}
.center-pin::after{
  content:""; position:absolute; left:50%; top:50%; width:5px; height:5px;
  margin:-2.5px 0 0 -2.5px; border-radius:50%; background:#4A3519;
}

.ribbon{
  position:absolute; left:50%; bottom:34px; width:34px; height:250px;
  margin-left:-17px; border-radius:7px;
  background:linear-gradient(90deg,#C9A96A 0%, #EFDFB2 28%, #D9BC83 62%, #B8965D 100%);
  border:1px solid #A98B55;
  box-shadow:0 3px 8px rgba(90,65,25,.25), inset 0 0 12px rgba(120,85,35,.25);
  display:flex; align-items:center; justify-content:center;
  font-family:"STKaiti","KaiTi",serif; font-size:13px; letter-spacing:4px; color:#5C4A28;
  writing-mode:vertical-rl; text-orientation:upright;
  opacity:1; transition:opacity .3s ease; z-index:4;
}
.fan-stage:hover .ribbon, .fan-stage.open .ribbon{opacity:0; pointer-events:none}

/* 点击弹窗 */
.modal-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(40,30,15,.38);
  backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; transition:opacity .18s ease, visibility .18s;
}
.modal-overlay.show{opacity:1; visibility:visible}
.modal{
  position:relative; width:min(380px,92vw); background:var(--card);
  border:1px solid var(--line); border-radius:16px; padding:20px 22px;
  box-shadow:0 22px 50px rgba(60,45,20,.28);
  transform:translateY(10px) scale(.98); transition:transform .18s ease;
}
.modal-overlay.show .modal{transform:translateY(0) scale(1)}
.m-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding-right:30px}
.m-name{font-family:"STKaiti","KaiTi",serif; font-size:18px; font-weight:600}
.m-code{color:var(--muted); font-size:11.5px}
.m-price{margin-left:auto; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums}
.m-close{
  position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:50%;
  border:none; background:#F3F0E8; color:var(--muted); cursor:pointer; font-size:14px;
  line-height:1; display:flex; align-items:center; justify-content:center;
}
.m-close:hover{background:#E9E4D8; color:var(--ink)}
.m-lights{font-size:16px; letter-spacing:1px; margin-bottom:10px}
.m-row{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--muted)}
.m-row b{color:var(--ink); font-variant-numeric:tabular-nums}
.verdict{
  display:inline-block; margin-top:8px; padding:2px 10px; border-radius:999px;
  font-size:11.5px; font-weight:600;
}
.v-ok{background:#ECFDF5; color:var(--green); border:1px solid #BBF7D0}
.v-warn{background:#FFFBEB; color:var(--amber); border:1px solid #FDE68A}
.v-bad{background:#FEF2F2; color:var(--red); border:1px solid #FECACA}
.up{color:var(--red)} .down{color:var(--green)}

@media (max-width:860px){
  .fan-wrapper{transform:scale(.72); transform-origin:top center; height:320px; margin-bottom:24px}
}
@media (prefers-reduced-motion:reduce){
  .fan,.blade,.modal-overlay,.modal{transition:none}
}
</style>
</head>
<body>
<h1>自选股折扇</h1>
<div class="caption">悬停展开 · 扇面悬停凸起 · 点击高亮并查看灯号</div>
<div class="controls">
  <button onclick="togglePin()">展开 / 合拢</button>
  <span class="hint" id="countHint"></span>
</div>

<div class="fan-wrapper">
  <div class="fan-stage" id="fanStage" tabindex="0"
       onmouseenter="hoverOpen(true)" onmouseleave="hoverOpen(false)"
       onfocus="hoverOpen(true)" onblur="hoverOpen(false)">
    <div class="fan" id="fanContainer">
      <div class="paper-arc"></div>
      <!-- JS 将在这里注入扇面与扇骨 -->
    </div>
    <div class="ribbon">自选股</div>
    <div class="center-pin"></div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="m-close" onclick="closeModal()" aria-label="关闭">×</button>
    <div class="m-head">
      <span class="m-name" id="mName"></span>
      <span class="m-code" id="mCode"></span>
      <span class="m-price" id="mPrice"></span>
    </div>
    <div class="m-lights" id="mLights"></div>
    <div class="m-row"><span>最新价</span><b id="mPrice2"></b></div>
    <div class="m-row"><span>今日涨跌</span><b id="mChg"></b></div>
    <div class="m-row"><span>六维灯号</span><b id="mCount"></b></div>
    <span class="verdict" id="mVerdict"></span>
  </div>
</div>

<script>
const STOCKS = [
  ["000333","美的集团","85.30","2.16","yellowyellowredgreengreenyellow"],
  ["000537","绿发电力","8.32","10.05","yellowyellowyellowredredyellow"],
  ["002371","北方华创","760.00","1.07","yellowgreenredredgreenyellow"],
  ["002837","英维克","55.24","-1.18","greenyellowyellowyellowgreenyellow"],
  ["003018","金富科技","38.30","-3.72","yellowyellowredredyellowyellow"],
  ["300308","中际旭创","864.58","-6.01","yellowgreenyellowgreengreenyellow"],
  ["300602","飞荣达","36.20","-2.95","greengreenyellowredyellowyellow"],
  ["300750","宁德时代","393.87","1.86","yellowyellowyellowredgreenyellow"],
  ["301018","申菱环境","89.42","3.16","yellowredredredgreenyellow"],
  ["600160","巨化股份","44.26","2.24","yellowgreenyellowredgreenyellow"],
  ["600487","亨通光电","59.62","0.17","yellowgreenredredredyellow"],
  ["600721","百花医药","11.59","9.96","yellowredredyellowredyellow"],
  ["601225","陕西煤业","26.04","3.99","yellowredyellowgreengreenyellow"],
  ["601628","中国人寿","37.70","-2.26","yellowredgreenyellowredyellow"],
  ["601899","紫金矿业","35.45","0.85","yellowgreenyellowgreengreenyellow"],
  ["603259","药明康德","161.34","4.21","yellowgreenredyellowyellowyellow"]
];

const N = STOCKS.length;
const PIN_X = 380, PIN_Y = 380;
const LIGHT = {green:"🟢", yellow:"🟡", red:"🔴"};
const fan = document.getElementById("fanContainer");
const stage = document.getElementById("fanStage");
let pinned = false;

document.getElementById("countHint").textContent = `共 ${N} 只 · 每片扇面一只`;
if (location.search.indexOf("open=1") !== -1){
  pinned = true;
  stage.classList.add("open");
}

// 扇骨：深色细条从中心向外辐射（N+1 条）
for (let i = 0; i <= N; i++){
  const a = i * (180 / N) - 90;
  const rib = document.createElement("div");
  rib.className = "rib";
  rib.style.transform = `rotate(${a}deg)`;
  fan.appendChild(rib);
}

// 扇面：每片楔形纸面 + 正立居中文字
STOCKS.forEach((s, i) => {
  const a = (i + 0.5) * (180 / N) - 90;
  const blade = document.createElement("div");
  blade.className = "blade";
  blade.style.setProperty("--a", a + "deg");
  blade.title = `${s[1]} ${s[0]}`;
  blade.setAttribute("role","button");
  blade.setAttribute("tabindex","0");
  blade.setAttribute("aria-label", `${s[1]} ${s[0]}`);
  blade.addEventListener("click", () => select(i, blade));
  blade.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); select(i, blade); }
  });

  const txt = document.createElement("div");
  txt.className = "blade-text";
  const nmLen = [...s[1]].length;
  const fs = Math.max(8, Math.min(16, Math.floor(44 / nmLen)));
  txt.innerHTML = `<span class="nm" style="font-size:${fs}px">${s[1]}</span>` +
                  `<span class="cd" style="font-size:${Math.max(6, fs - 3)}px">${s[0].slice(-4)}</span>`;
  blade.appendChild(txt);
  fan.appendChild(blade);
});

function select(i, blade){
  document.querySelectorAll(".blade.sel").forEach(b => b.classList.remove("sel"));
  blade.classList.add("sel");
  showModal(i);
}

function hoverOpen(on){
  if (pinned) return;
  stage.classList.toggle("open", on);
}

function togglePin(){
  pinned = !pinned;
  stage.classList.toggle("open", pinned);
  if (pinned) stage.focus();
}

function showModal(i){
  const s = STOCKS[i];
  const lights = s[4].split("").map(c => LIGHT[c] || "🟡").join("");
  const g = s[4].split("").filter(c => c === "green").length;
  const r = s[4].split("").filter(c => c === "red").length;
  const pct = parseFloat(s[3]);
  const cls = pct > 0 ? "up" : (pct < 0 ? "down" : "");
  document.getElementById("mName").textContent = s[1];
  document.getElementById("mCode").textContent = s[0];
  document.getElementById("mPrice").textContent = s[2];
  document.getElementById("mPrice").className = cls;
  document.getElementById("mLights").textContent = lights;
  document.getElementById("mPrice2").textContent = s[2] + " 元";
  document.getElementById("mChg").textContent = (pct > 0 ? "+" : "") + pct.toFixed(2) + "%";
  document.getElementById("mChg").className = cls;
  document.getElementById("mCount").textContent = `绿 ${g} · 红 ${r}`;
  const v = document.getElementById("mVerdict");
  if (g >= 4 && r === 0){ v.textContent = "可建仓"; v.className = "verdict v-ok"; }
  else if (r >= 2){ v.textContent = "需要关注"; v.className = "verdict v-bad"; }
  else if (g >= 3){ v.textContent = "接近可建仓"; v.className = "verdict v-warn"; }
  else { v.textContent = "暂不可建仓"; v.className = "verdict"; }
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.querySelectorAll(".blade.sel").forEach(b => b.classList.remove("sel"));
  document.getElementById("modal").classList.remove("show");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});
</script>
</body>
</html>
